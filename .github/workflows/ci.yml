name: ci
on: [push, pull_request]

jobs:
  check:
    name: static-site integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: HTML parses, JSON valid, every local asset present
        run: python3 scripts/check.py
